<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bekal Nanjak</title>
<meta name="description" content="Rencanakan bekal pendakian: kebutuhan kalori, menu per waktu makan, cadangan, daftar belanja, estimasi biaya, dan kebutuhan air.">
<meta name="theme-color" content="#1F4D3A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --ink:#15201A; --muted:#56655C; --line:#E2E8E1;
  --pine:#1F4D3A; --pine2:#2F7356; --greenbg:#E3F3E9; --green:#257A4B;
  --blaze:#E2642A; --blaze-ink:#B4501E; --amberbg:#FCF1D8; --red:#B8352A;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111814; --surface:#1B2520; --ink:#EAF0EB; --muted:#9FB0A5; --line:#2E3C34;
    --pine:#1B4533; --pine2:#2C6A50; --greenbg:#16301F; --green:#6FD39B;
    --blaze:#F07A42; --blaze-ink:#F07A42; --amberbg:#352A12; --red:#F08A7E;
  }
}
:root[data-theme="dark"]{
  --bg:#111814; --surface:#1B2520; --ink:#EAF0EB; --muted:#9FB0A5; --line:#2E3C34;
  --pine:#1B4533; --pine2:#2C6A50; --greenbg:#16301F; --green:#6FD39B;
  --blaze:#F07A42; --blaze-ink:#F07A42; --amberbg:#352A12; --red:#F08A7E;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:Barlow,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;line-height:1.05;margin:0}
button,select,input{font:inherit;color:inherit}
.wrap{width:100%;max-width:640px;margin:0 auto;padding-left:16px;padding-right:16px}
.topo{position:absolute;inset:0;width:100%;height:100%;opacity:.22;pointer-events:none}
.logo{display:inline-block;width:34px;height:34px;border-radius:9px;flex:none}

/* header */
.top{position:relative;display:block;width:100%;background:var(--pine);color:#fff;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
.top .wrap{position:relative;padding-top:14px;padding-bottom:20px}
.hdr-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px}
.hdr-right{display:flex;align-items:center;gap:8px}
.hbtn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;min-height:40px;padding:0 12px;font-weight:600;cursor:pointer}
.hdr-step{opacity:.85;font-size:.92rem;margin:12px 0 4px}
.top h1{font-size:2.2rem;letter-spacing:.01em;overflow-wrap:anywhere}
.hdr-meta{margin:6px 0 0;opacity:.9}
.progress{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:16px}
.progress i{display:block;height:5px;border-radius:99px;background:rgba(255,255,255,.25)}
.progress i.on{background:#fff}

/* onboarding */
.ob{position:relative;min-height:100vh;min-height:100dvh;background:var(--pine);color:#fff;overflow:hidden;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ob .wrap{position:relative;flex:1;display:flex;flex-direction:column;padding-top:16px;padding-bottom:28px}
.ob .grow{flex:1;min-height:24px}
.ob h1{font-size:3.2rem}
.ob p.lead{font-size:1.1rem;opacity:.92;margin:10px 0 22px;max-width:34ch}
.ob ol{list-style:none;padding:0;margin:0 0 26px;display:grid;gap:12px}
.ob li{display:flex;gap:12px;align-items:flex-start}
.ob li b{flex:none;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-family:"Barlow Condensed",sans-serif;font-size:1.05rem}
.ob li span{padding-top:2px}
.lang{display:inline-flex;background:rgba(255,255,255,.14);border-radius:10px;padding:3px}
.lang button{border:0;background:transparent;color:#fff;border-radius:8px;min-height:34px;min-width:40px;font-weight:700;cursor:pointer;opacity:.75}
.lang button[aria-pressed=true]{background:#fff;color:#1F4D3A;opacity:1}
.btn{display:flex;align-items:center;justify-content:center;width:100%;border:0;border-radius:14px;min-height:54px;padding:0 18px;font-family:"Barlow Condensed",sans-serif;font-size:1.45rem;font-weight:700;background:var(--pine);color:#fff;cursor:pointer}
.btn:active{background:var(--pine2)}
.btn.light{background:#fff;color:#1F4D3A}
.btn.ghost{background:transparent;color:inherit;border:1.5px solid currentColor}
.btn.sm{min-height:44px;font-size:1.2rem;width:auto}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ob .btn+.btn{margin-top:10px}

/* body */
main.wrap{padding-top:18px;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;min-width:0}
.card h2{font-size:1.45rem;margin-bottom:4px}
.hint{color:var(--muted);font-size:.92rem;margin:0 0 12px}
.opts{display:grid;gap:8px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:56px}
.opt b{display:block;font-size:1.05rem}
.opt small{display:block;color:var(--muted);font-size:.86rem}
.opt[aria-pressed=true]{border-color:var(--pine2);background:var(--greenbg)}
.opt .check{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line)}
.opt[aria-pressed=true] .check{border-color:var(--pine2);background:var(--pine2);box-shadow:inset 0 0 0 4px var(--greenbg)}
.seg{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));background:var(--bg);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{border:0;background:transparent;border-radius:10px;min-height:44px;font-weight:600;color:var(--muted);cursor:pointer;padding:0 6px}
.seg button[aria-pressed=true]{background:var(--pine);color:#fff}
.field{display:block;margin-bottom:14px;min-width:0}
.field:last-child{margin-bottom:0}
.field>span{display:block;font-weight:600;margin-bottom:6px}
.field input,.field select{display:block;width:100%;min-width:0;min-height:48px;font-size:1.05rem;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px}
.field select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.field input:focus,.field select:focus{outline:none;border-color:var(--pine2)}
.field select:disabled{opacity:.5}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.row2 .field{margin-bottom:0}
.dur{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);border-radius:12px;padding:6px}
.dur button{width:46px;height:44px;border:0;border-radius:10px;background:var(--surface);font-size:1.5rem;font-weight:700;cursor:pointer}
.dur span{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.35rem}
.err{color:var(--red);font-size:.9rem;margin:8px 0 0;min-height:0}
.est{background:var(--bg);border-radius:12px;padding:12px 14px;margin-top:4px}
.est b{font-family:"Barlow Condensed",sans-serif;font-size:1.3rem}
.elev{display:flex;align-items:center;gap:12px}
.elev small{display:block;color:var(--muted);font-size:.8rem}
.elev .arr{color:var(--muted);font-size:1.3rem}
.slider{margin-bottom:18px}
.slider:last-child{margin-bottom:0}
.slider .sr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.slider output{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.4rem;line-height:1}
.slider output small{font-family:Barlow,sans-serif;font-weight:500;color:var(--muted);font-size:.85rem;margin-left:3px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;background:var(--line);outline:none;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--surface);border:3px solid var(--pine2);cursor:pointer}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--surface);border:3px solid var(--pine2);cursor:pointer}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:12px 0;cursor:pointer;min-height:58px}
.switch.first{border-top:0}
.switch b{display:block;font-weight:600}
.switch small{display:block;color:var(--muted);font-size:.86rem}
.sw-wrap{display:flex;align-items:center;gap:10px;flex:none}
.sw{flex:none;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.switch[aria-checked=true] .sw{background:var(--pine2)}
.switch[aria-checked=true] .sw::after{transform:translateX(18px)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--blaze);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.sw,.sw::after{transition:none}}

.day h3{font-size:1.4rem}
.dmeta{color:var(--muted);font-size:.9rem;margin:2px 0 4px}
.kcal-tag{font-family:"Barlow Condensed",sans-serif;font-weight:700;color:var(--muted);font-size:1.05rem;white-space:nowrap}
.row-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}

/* result */
.hero{position:relative;overflow:hidden;background:var(--pine);color:#fff;border-radius:14px;padding:16px 18px;margin-bottom:10px}
.hero .topo{opacity:.18}
.big{position:relative;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big b{font-family:"Barlow Condensed",sans-serif;font-size:3.4rem;font-weight:700;line-height:1}
.hero p{position:relative;margin:4px 0 0;opacity:.9;font-size:.95rem}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.stat small{display:block;color:var(--muted);font-size:.8rem}
.stat b{font-family:"Barlow Condensed",sans-serif;font-size:1.45rem;font-weight:700}
.stat.w b{color:var(--blaze-ink)}.stat.a b{color:var(--green)}
.meal{border-top:1px solid var(--line);padding:12px 0 4px}
.meal-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.meal-h b{font-size:1.05rem}
.meal-h .r{display:flex;align-items:center;gap:8px}
.meal.off .meal-h b{color:var(--muted);font-weight:500}
.edit{border:1.5px solid var(--line);background:transparent;border-radius:999px;min-height:36px;padding:0 12px;font-weight:600;font-size:.9rem;cursor:pointer}
.items{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.items span{background:var(--bg);border-radius:8px;padding:4px 10px;font-size:.9rem}
.badge{font-size:.75rem;font-weight:700;color:var(--blaze-ink);margin-left:6px}
.note{color:var(--muted);font-size:.9rem;margin:0 0 10px}
.alert{background:var(--amberbg);border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:.93rem}
.shop{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.shop .sr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 12px;border-top:1px solid var(--line)}
.shop .sr:first-child{border-top:0}
.shop .sr b{font-weight:600}
.shop .sr em{font-style:normal;color:var(--muted);font-size:.88rem}
.shop .sr .p{text-align:right;font-weight:600;white-space:nowrap}
.shop .sr input{width:110px;min-height:38px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);padding:4px 8px;text-align:right}
.shop .tot{display:flex;justify-content:space-between;padding:12px;border-top:2px solid var(--line);font-weight:700;background:var(--bg)}
.linkbtn{border:0;background:transparent;color:var(--green);font-weight:600;cursor:pointer;padding:6px 0;min-height:40px}
details.card>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;min-height:32px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary h2{margin:0}
details.card>summary .chev{transition:transform .15s;color:var(--muted)}
details.card[open]>summary .chev{transform:rotate(180deg)}
.tips{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:12px}
.tips li{display:flex;gap:10px}
.tips li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--blaze);margin-top:8px}
.toast{text-align:center;color:var(--green);font-size:.92rem;min-height:1.3em;margin:8px 0 0}
textarea{width:100%;min-height:150px;margin-top:8px;font:inherit;font-size:.88rem;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.about{color:var(--muted);font-size:.9rem}
footer{color:var(--muted);font-size:.85rem;margin-top:8px}
footer a{color:var(--green)}

.sched{margin:10px 0 4px}
.prof{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--muted);margin:4px 0 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.ld{width:9px;height:9px;border-radius:50%;background:var(--blaze);display:inline-block}
.lm{width:9px;height:9px;background:var(--pine2);transform:rotate(45deg);display:inline-block}
.tld>summary{cursor:pointer;font-weight:600;color:var(--green);min-height:40px;display:flex;align-items:center}
.tlist{display:grid;margin:2px 0 6px}
.tl{display:grid;grid-template-columns:48px 26px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:.92rem}
.tl:first-child{border-top:0}
.tl .tm{font-variant-numeric:tabular-nums;font-weight:600}
.tl .mk{width:10px;height:10px;border-radius:50%;background:var(--line);justify-self:center}
.tl.snack .mk{background:var(--blaze)}
.tl.meal .mk{background:var(--pine2);border-radius:2px;transform:rotate(45deg)}
.tl.peak .mk,.tl.start .mk,.tl.end .mk{background:var(--ink)}
.tl .ac b{font-weight:600}
.tl .ac small{color:var(--muted)}
.tl .ac .what{display:block;color:var(--ink);font-size:.86rem;margin-top:1px}
.tl.off .ac b{color:var(--muted);font-weight:500}
.tl .el{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.disc{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:.9rem;color:var(--ink);background:var(--surface)}
.disc b{display:block;margin-bottom:2px}
.ob .disc{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff;margin:0 0 16px}
.term{display:inline;border:0;background:none;padding:0;color:inherit;font:inherit;text-decoration:underline dotted;text-underline-offset:3px;cursor:help}
.top .term,.hero .term,.ob .term{color:#fff}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:0;border-radius:10px;background:rgba(255,255,255,.14);color:#fff;cursor:pointer;font-weight:700;font-size:1.1rem}
.tabs{position:sticky;top:0;z-index:4;background:var(--bg);padding:10px 0 8px;margin-bottom:6px}
.tabs .seg{margin:0}
.tabs .seg button{font-size:.95rem}
.big3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;position:relative;margin-top:12px}
.big3 div{background:rgba(255,255,255,.12);border-radius:10px;padding:10px}
.big3 small{display:block;opacity:.85;font-size:.8rem}
.big3 b{font-family:"Barlow Condensed",sans-serif;font-size:clamp(1rem,4.6vw,1.5rem);line-height:1.1;white-space:nowrap}
.key{display:grid;gap:12px;margin:0;padding:0;list-style:none;counter-reset:k}
.key li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;counter-increment:k}
.key li::before{content:counter(k);width:28px;height:28px;border-radius:50%;background:var(--greenbg);color:var(--green);display:flex;align-items:center;justify-content:center;font-weight:700}
.key b{display:block}
.jump{display:grid;gap:8px}
.jump .opt{min-height:52px}
.gl{border-top:1px solid var(--line);padding:12px 0}
.gl:first-child{border-top:0}
.gl b{display:block;font-size:1.05rem}
.gl p{margin:2px 0 0;color:var(--muted)}
.why{display:block;color:var(--muted);font-size:.84rem;margin-top:2px}
.needbox{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:8px 0 4px}
.needbox div{background:var(--bg);border-radius:10px;padding:8px 10px}
.needbox small{display:block;color:var(--muted);font-size:.8rem}
.needbox b{font-family:"Barlow Condensed",sans-serif;font-size:1.25rem}
.why2>summary{cursor:pointer;color:var(--green);font-weight:600;min-height:40px;display:flex;align-items:center;font-size:.92rem}
.why2 p{margin:0 0 8px;color:var(--muted);font-size:.9rem}
.preset{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.preset b{display:block}
.preset small{display:block;color:var(--muted);font-size:.84rem}
.confirm p{margin:8px 0 0}
.items span.late{background:var(--amberbg)}
.items span em{font-style:normal;color:var(--blaze-ink);font-weight:600;font-size:.8rem}
.balrow{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 10px}
.bal{font-size:.8rem;color:var(--muted);padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.bal.ok{color:var(--green);border-color:transparent;background:var(--greenbg)}
.bal.no{color:var(--muted)}
.sgh{display:flex;justify-content:space-between;padding:8px 12px;background:var(--bg);font-weight:700;font-size:.9rem;border-top:1px solid var(--line)}
.sgh:first-child{border-top:0}
.sgh span{color:var(--muted);font-weight:600}
.pk{border-top:1px solid var(--line);padding:4px 0}
.pk:first-of-type{border-top:0}
.pk>summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center;justify-content:space-between;list-style:none}
.pk>summary::-webkit-details-marker{display:none}
.pk>summary .chev{transition:transform .15s;color:var(--muted);flex:none}
.pk[open]>summary .chev{transform:rotate(180deg)}
.pk .tips{margin:4px 0 12px}
.people{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--bg);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.people b{display:block}.people small{color:var(--muted);font-size:.84rem}
.dur.sm{padding:4px;gap:6px;flex:none;background:var(--surface)}
.dur.sm button{width:40px;height:40px;font-size:1.3rem;background:var(--bg)}
.dur.sm span{font-size:1.15rem;min-width:64px;text-align:center}
.ck{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);background:var(--surface);margin-right:10px;vertical-align:-6px;cursor:pointer;flex:none;position:relative}
.ck[aria-checked=true]{background:var(--pine2);border-color:var(--pine2)}
.ck[aria-checked=true]::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.sr.got b{text-decoration:line-through;color:var(--muted)}
.done-hero{position:relative;overflow:hidden;background:var(--pine);color:#fff;border-radius:14px;padding:22px 18px;margin-bottom:14px;text-align:left}
.done-hero h2{font-size:2rem;margin:6px 0}
.check-big{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;position:relative}
.preview b{color:var(--ink)}
.preview{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:.85rem;color:var(--muted);margin:0 0 12px;max-height:9.5em;overflow:hidden}

function slotsOfDay(i,n){return ORDER.filter(s=>!(s==="malam"&&i===n-1))}
function defaultMealOn(i,slot,n){
  const h=parseInt(S.startTime,10); const startH=isFinite(h)?h:8;
  if(n===1) return slot==="cemilan"||(slot==="siang"&&startH<13);
  if(slot==="malam"&&i===n-1) return false;
  if(i===0){ if(slot==="sarapan") return false; if(slot==="siang") return startH<14; return true; }
  if(i===n-1){ if(slot==="siang") return false; return true; }
  return true;
}
function mealOn(i,slot){const k=`d${i}-${slot}`;return (k in S.meals)?S.meals[k]:defaultMealOn(i,slot,days())}
function hoursPerDay(rd,n){
  if(n===1) return [{up:rd.up,down:rd.down}];
  return Array.from({length:n},(_,i)=>i<n-1?{up:rd.up*0.8/(n-1),down:0}:{up:rd.up*0.2,down:rd.down});
}
function templateRecipe(slot,i){
  const veg=S.veg, light=S.light;
  if(slot==="sarapan") return light?"oatpisang":(i<=2?"nasgorkampung":"rotiselai");
  if(slot==="malam"){ if(light) return null; if(veg) return i===0?"bacem":(i===1?"tempeorek":null); return i===0?"ayamsambal":(i===1?"teluresop":"liwet"); }
  return null;
}
function template(slot,i){
  const veg=S.veg, light=S.light, rid=templateRecipe(slot,i);
  if(rid){
    const pr=PRESETS.find(p=>p.id===rid);
    const kb=pr.items.find(([id])=>FOODS[id].c==="karbo"); const flexId=kb?kb[0]:pr.items[0][0];
    const drink=slot==="sarapan"?(rid==="nasgorkampung"?"jahe":"kopi"):(i===0?"jahe":i===1?"coklatpanas":"teh");
    const out=pr.items.map(([id,q])=>[id,q,id===flexId?1:0]);
    if(slot==="malam"&&rid==="ayamsambal") out.push(["tahubacem",1,0]);
    if(slot==="sarapan"&&rid==="rotiselai") out.push(["skm",1,0]);
    return out.concat([[drink,1,0]]);
  }
  switch(slot){
    case "siang": return (i===0&&!light)?[["nasib",1,0],["pisang",1,0]]:[["rotisi",2,1],[veg?"tempe":"abon",1,0],["jeruk",1,0]];
    case "malam": return light?[["mie",1,1],[veg?"tempe":"abon",1,0],["sop",1,0],["jahe",1,0]]:[["beras",1,1],["tempe",1,0],["sop",1,0],["sambal",1,0],["teh",1,0]];
    case "sarapan": return [["oat",2,1],["pisang",1,0],["kopi",1,0]];
    case "cemilan": return light?[["kacang",3,1],["coklat",3,1],["kurma",2,1],["aren",1,1]]:[["kurma",2,1],["coklat",2,1],["kacang",2,1],["wafer",2,1],["aren",1,1]];
    case "cadangan": return [["mie",1,0],["biskuit",1,1],["coklat",1,1],["aren",1,1]];
  }
  return [];
}
function mealRecipes(key,slot,i){ if(S.custom[key]) return (S.recipeOf&&S.recipeOf[key])||[]; const r=templateRecipe(slot,i); return r?[r]:[]; }
const TAGS={
  nuts:["kacang","selaikacang"],
  seafood:["sarden","teri","tuna","saustiram"],
  dairy:["keju","susububuk","skm","coklatpanas","energen"],
  egg:["telur","telurmentah"],
  sugar:["aren","gula","madu","permen","jelly","skm","selaicoklat","teh","jahe","coklatpanas","energen"],
  meat:["abon","sosis","sarden","kornet","rendang","dendeng","ayamungkep","teri","tuna","nugget","saustiram"]
};
const AVOID_LBL={nuts:["Tanpa kacang","No nuts"],seafood:["Tanpa seafood","No seafood"],dairy:["Tanpa susu","No dairy"],egg:["Tanpa telur","No eggs"],sugar:["Kurangi gula","Less sugar"]};
const ALT={protein:["tempe","tempegoreng","tahubacem","abon","ayamungkep","telurmentah","sosis","kornet"],camilan:["kurma","kismis","biskuit","energybar","pisang","coklat","wafer","keripik"],minum:["kopi","elektrolit"],karbo:["beras","oat","roti"]};
function avoidTags(){ const t=Object.keys(S.avoid||{}).filter(k=>S.avoid[k]); if(S.veg) t.push("meat"); return t; }
function avoidedBy(id){ return avoidTags().filter(t=>TAGS[t].includes(id)); }
const isAvoided=id=>avoidedBy(id).length>0;
function filterAvoid(t){
  const present=new Set(t.map(x=>x[0])); let out=[];
  t.forEach(([id,q,f])=>{
    if(!isAvoided(id)){ out.push([id,q,f]); return; }
    const alt=(ALT[FOODS[id].c]||[]).find(a=>!isAvoided(a)&&!present.has(a));
    if(alt){ present.add(alt); out.push([alt,q,f]); } else if(f) out.push(["beras",1,1]);
  });
  if(out.length&&!out.some(x=>x[2])) out[0][2]=1;
  return out;
}
const avoidNote=id=>{const t=avoidedBy(id); return t.length?t.map(k=>k==="meat"?L("daging","meat"):L(...AVOID_LBL[k]).replace(/^(Tanpa |Kurangi |No |Less )/,"").toLowerCase()).join(", "):"";};
function suggest(slot,i,target){
  const t=filterAvoid(template(slot,i)); let fixed=0,flexK=0;
  t.forEach(([id,q,f])=>{if(f) flexK+=FOODS[id].k*q; else fixed+=FOODS[id].k*q});
  const remain=Math.max(0,target-fixed);
  return t.map(([id,q,f])=>f?[id,Math.max(1,Math.round(remain*(FOODS[id].k*q/flexK)/FOODS[id].k))]:[id,q]);
}
function itemsFor(key,slot,i,target,stops){
  if(S.custom[key]) return S.custom[key].filter(([id,q])=>food(id)&&q>0);
  const it=suggest(slot,i,target);
  if(slot==="cemilan"&&stops){
    let units=it.reduce((a,[,q])=>a+q,0); const fill=["kurma","aren","permen","kismis","biskuit"].filter(x=>!isAvoided(x)); let f=0; if(!fill.length) fill.push("kurma");
    while(units<stops){ const id=fill[f++%fill.length]; const x=it.find(y=>y[0]===id); if(x) x[1]++; else it.push([id,1]); units++; }
  }
  return it;
}
function calc(){
  const rd=routeData(); if(!rd) return null;
  const n=days(), gain=Math.max(100,rd.peak-rd.base);
  const bmr=10*S.weight+6.25*S.height-5*S.age+(S.sex==="m"?5:-161);
  const pf=isManual()?1:(PACE[S.pace]||1);
  const metUp=clamp(5.5+(gain/Math.max(.5,rd.up/pf))/120,5.5,9.5);
  const D=hoursPerDay(rd,n).map((h,i)=>{
    const trekH=h.up+h.down;
    const trekK=(metUp*h.up+4.5*h.down)/pf*(S.weight+S.load), restK=bmr/24*Math.max(0,24-trekH)*(S.cold?1.3:1.2);
    const need=trekK+restK;
    const water=Math.round((trekH*0.6+(n>1?1.5:0.5))*(S.adjWater||1)*2)/2;
    const meals=slotsOfDay(i,n).map(slot=>{
      const key=`d${i}-${slot}`, on=mealOn(i,slot), raw=need*SLOTS[slot].share;
      const adj=S.adjFood||1;
      const target=(slot==="cemilan"?Math.min(raw,Math.max(300,trekH*SNACK_PER_H)):Math.min(raw,CAP[slot]))*adj;
      return {key,slot,on,target,custom:!!S.custom[key],items:on?itemsFor(key,slot,i,target,slot==="cemilan"?Math.max(0,Math.ceil(trekH-1.25)):0):[]};
    });
    const packed=meals.reduce((a,m)=>a+kOf(m.items),0);
    const home=need*ORDER.filter(sl=>!meals.some(m=>m.slot===sl&&m.on)).reduce((a,sl)=>a+SLOTS[sl].share,0);
    return {i,trekH,need,trekK,water,meals,up:h.up,down:h.down,packed,home,gap:Math.max(0,need-packed-home)};
  });
  const rT=S.reserve==="none"?0:S.reserve==="day"?bmr*1.6:750;
  const reserve={key:"reserve",target:rT,custom:!!S.custom.reserve,items:S.reserve==="none"?[]:itemsFor("reserve","cadangan",0,rT)};
  const shop={}; const add=l=>l.forEach(([id,q])=>{shop[id]=(shop[id]||0)+q});
  D.forEach(d=>d.meals.forEach(m=>add(m.items))); add(reserve.items);
  let K=0,G=0,P=0; for(const [id,q] of Object.entries(shop)){const f=food(id);K+=f.k*q;G+=f.g*q;P+=fprice(id)*q}
  const need=D.reduce((a,d)=>a+d.need,0), trekH=D.reduce((a,d)=>a+d.trekH,0);
  const snackK=D.reduce((a,d)=>a+d.meals.filter(m=>m.slot==="cemilan"&&m.on).reduce((b,m)=>b+kOf(m.items),0),0);
  return {rd,n,D,reserve,shop,K,G,P,need,perDay:need/n,water:D.reduce((a,d)=>a+d.water,0),snackPerHour:trekH?Math.round(snackK/trekH/10)*10:0};
}

function vRoute(){

  const list=S.prov?(PROV.find(([p])=>p===S.prov)||[,[]])[1]:[];
  const mOpts=list.map(([k,n,pk])=>`<option value="${k}" ${k===S.mountain?"selected":""}>${esc(n)}, ±${fmt(pk)} mdpl${ROUTES[k]?" ✓":""}</option>`).join("");
  const rOpts=rs.map(r=>`<option value="${r.id}" ${r.id===S.route?"selected":""}>${esc(r.n)}</option>`).join("")+`<option value="manual" ${isManual()?"selected":""}>${L("Jalur lain, isi sendiri","Other trail, enter manually")}</option>`;

    detail=`<div class="est"><div class="elev"><span><small>${L("Basecamp, titik mulai","Basecamp, start")}</small><b>${fmt(r.base)} ${term("mdpl")}</b></span><span class="arr" aria-hidden="true">→</span><span><small>${L("Puncak","Summit")}</small><b>${fmt(r.peak||m.peak)} ${term("mdpl")}</b></span></div>
      <p class="hint" style="margin:8px 0 0">${L(`Total tanjakan ±${fmt((r.peak||m.peak)-r.base)} meter. Waktu jalan pendaki rata-rata: naik ±${dec(r.up)} jam, turun ±${dec(r.down)} jam. Angka perkiraan.`,`Total climb ±${fmt((r.peak||m.peak)-r.base)} metres. Average walking time: up ±${dec(r.up)} h, down ±${dec(r.down)} h. Estimates only.`)}</p></div>`;
  } else if(m&&isManual()){
    detail=`<p class="alert">${L(`Data jalur gunung ini belum tersedia. Tanyakan ketinggian ${term("basecamp","basecamp")} dan perkiraan jam naik-turun ke pengelola atau pendaki yang pernah ke sana. Kalau ini pendakian pertamamu, gunung bertanda ✓ lebih mudah direncanakan.`,`We don't have trail data for this mountain yet. Ask the park office or someone who has hiked it for the ${term("basecamp","basecamp")} height and hours up and down. For a first hike, mountains marked ✓ are easier to plan.`)}</p>

      <label class="field"><span>${L("Puncak (mdpl)","Summit (m)")}</span><input type="number" inputmode="numeric" data-k="peakManual" value="${esc(S.peakManual||m.peak)}"></label></div>
      <div class="row2"><label class="field"><span>${L("Jam naik","Hours up")}</span><input type="number" step="0.5" inputmode="decimal" data-k="upManual" value="${esc(S.upManual)}" placeholder="6"></label>
      <label class="field"><span>${L("Jam turun","Hours down")}</span><input type="number" step="0.5" inputmode="decimal" data-k="downManual" value="${esc(S.downManual)}" placeholder="4"></label></div>
      <p class="hint" style="margin:0">${L("Jam naik dan turun adalah total waktu berjalan dari basecamp ke puncak dan sebaliknya, tanpa waktu menginap.","Hours up and down are the total walking time from basecamp to the summit and back, excluding overnight stops.")}</p>`;
  }
  return header(L("Mau naik ke mana?","Where are you hiking?"),L("Rencana pendakian","Trip plan"))+`<main class="wrap">
    <div class="card"><h2>${L("Gunung dan jalur","Mountain and trail")}</h2><p class="hint">${L("Pilih provinsi dulu, lalu gunung dan jalurnya. Gunung bertanda ✓ sudah punya data jalur, jadi lebih mudah untuk pemula.","Pick a province first, then the mountain and trail. Mountains marked ✓ have trail data, which makes them easier for beginners.")}</p>
      <label class="field"><span>${L("Provinsi","Province")}</span><select data-k="prov"><option value="">${L("Pilih provinsi","Choose a province")}</option>${provOpts}</select></label>
      <label class="field"><span>${L("Gunung","Mountain")}</span><select data-k="mountain" ${S.prov?"":"disabled"}><option value="">${L("Pilih gunung","Choose a mountain")}</option>${mOpts}</select></label>

      ${detail}
    </div></main>`+bar(L("Lanjut","Next"),!!routeData());
}

function planError(){
  if(!fullDate(S.start)) return L("Pilih tanggal naik.","Choose a start date.");
  if(S.start<todayStr()) return L("Tanggal naik sudah lewat. Pilih hari ini atau setelahnya.","The start date has passed. Choose today or later.");
  if(S.type==="multi"){
    if(!fullDate(S.end)) return L("Pilih tanggal turun.","Choose an end date.");
    if(S.end<=S.start) return L("Tanggal turun minimal 1 hari setelah tanggal naik.","The end date must be at least 1 day after the start date.");
    if(days()>10) return L("Rencana makan dibatasi sampai 10 hari.","Meal plans are limited to 10 days.");
  }
  return "";
}

      <div class="row2"><label class="field"><span>${multi?L("Naik","Start"):L("Tanggal","Date")}</span><input type="date" data-k="start" value="${S.start}" min="${todayStr()}"></label>

function whyOff(i,slot,n){
  const t=S.startTime||"08:00";
  if(slot==="sarapan") return L(`Kamu mulai jalan pukul ${t}, jadi biasanya sarapan di rumah atau basecamp.`,`You start at ${t}, so you'd usually eat breakfast at home or basecamp.`);
  if(slot==="siang"&&i===0) return L(`Kamu mulai pukul ${t}, jadi makan siang sebelum berangkat.`,`You start at ${t}, so you'll have lunch before setting off.`);
  if(slot==="siang") return L("Biasanya sudah sampai basecamp sebelum makan siang.","You'll usually be back at basecamp before lunch.");
  if(slot==="malam") return L("Kamu sudah turun, jadi makan malam di rumah atau warung basecamp.","You'll be down by then, so have dinner at home or a basecamp stall.");

const hhmm=h=>{h=((h%24)+24)%24;const m=Math.round(h*60);return `${pad(Math.floor(m/60)%24)}:${pad(m%60)}`};
function dayPlan(R,d){
  const rd=R.rd, gain=Math.max(100,rd.peak-rd.base), n=R.n;
  const before=R.D.slice(0,d.i).reduce((a,x)=>a+x.up,0);
  const e0=rd.base+gain*(rd.up?before/rd.up:0), eTop=e0+gain*(rd.up?d.up/rd.up:0);
  const summit=d.down>0, walk=d.up+d.down;
  const st=parseInt(S.startTime,10), sm=parseInt((S.startTime||"").split(":")[1],10)||0;
  const start=d.i===0?(isFinite(st)?st+sm/60:8):6;
  const elev=t=>{ if(t<=d.up){const p=d.up?t/d.up:1; return e0+(eTop-e0)*(1-Math.pow(1-p,1.25));}
    const p=d.down?(t-d.up)/d.down:1; return eTop-(eTop-rd.base)*Math.pow(p,1.1); };
  const has=slot=>d.meals.find(m=>m.slot===slot);
  const lunch=has("siang"); let tL=null;
  if(lunch&&lunch.on&&walk>0&&start<12&&start+walk>12) tL=12-start;
  const PAUSE=.5, clock=t=>start+t+(tL!=null&&t>tL?PAUSE:0);
  const snackM=has("cemilan"), stops=[];
  for(let t=1;t<walk-0.25;t++){ if(tL!=null&&Math.abs(t-tL)<0.5) continue; stops.push(t); }
  // bagi camilan ke setiap waktu ngemil, porsi terbesar dulu ke titik yang paling sedikit
  const bins=stops.map(()=>({k:0,it:{}}));
  if(snackM&&snackM.on&&bins.length){
    const units=[]; snackM.items.forEach(([id,q])=>{for(let u=0;u<q;u++) units.push(id)});
    units.sort((a,b)=>food(b).k-food(a).k).forEach(id=>{const bn=bins.reduce((m,x)=>x.k<m.k?x:m,bins[0]); bn.k+=food(id).k; bn.it[id]=(bn.it[id]||0)+1;});
  }
  const listTxt=it=>Object.entries(it).map(([id,q])=>`${fname(id)} ${qty(id,q)}`).join(", ");
  const mealTxt=m=>m&&m.on?listTxt(Object.fromEntries(m.items)):"";
  const ev=[], arrive=clock(walk);
  const meal=(m,time,e,where)=>ev.push({kind:"meal",slot:m.slot,time,e,label:L(...SLOTS[m.slot].n),on:m.on,where,what:mealTxt(m),k:m.on?kOf(m.items):0});
  const sar=has("sarapan"); if(sar) meal(sar,start-.5,e0,d.i===0?L("di basecamp","at basecamp"):L("di camp","at camp"));
  if(lunch&&walk>0&&start>=12) meal(lunch,Math.max(11.5,start-1),e0,L("sebelum jalan","before hiking"));
  ev.push({kind:"start",time:start,e:e0,label:d.i===0?L("Mulai dari basecamp","Leave basecamp"):L("Mulai jalan dari camp","Leave camp")});
  stops.forEach((t,ix)=>{const bn=bins[ix]; ev.push({kind:"snack",k:bn.k,t,time:clock(t),e:elev(t),label:bn.k?`${L("Ngemil","Snack")} ±${fmt(bn.k)} ${L("kkal","kcal")}`:L("Istirahat dan minum, camilan sudah habis","Rest and drink; your snacks are used up"),what:bn.k?listTxt(bn.it):L("Tambah camilan di tab Menu kalau masih ingin ngemil di titik ini.","Add snacks in the Menu tab if you'd like something here.")})});
  if(tL!=null) meal(lunch,12,elev(tL),L("di jalur","on the trail")), ev[ev.length-1].t=tL;
  if(summit) ev.push({kind:"peak",t:d.up,time:clock(d.up),e:eTop,label:L("Puncak","Summit")});
  ev.push({kind:"end",time:arrive,e:summit?rd.base:eTop,label:summit?L("Sampai basecamp","Back at basecamp"):L("Sampai camp, perkiraan","Reach camp, estimated")});
  if(lunch&&lunch.on&&walk>0&&tL==null&&start<12) meal(lunch,Math.max(arrive+.25,12),summit?rd.base:eTop,summit?L("di basecamp","at basecamp"):L("di camp","at camp"));
  const din=has("malam"); if(din&&!summit) meal(din,Math.max(arrive+1,18),eTop,L("di camp","at camp"));
  ev.sort((a,b)=>a.time-b.time);
  ev.forEach((x,ix)=>x.id=`d${d.i}-${x.kind}-${x.slot||ix}-${Math.round(x.time*60)}`);
  return {start,walk,elev,clock,tL,ev,e0,eTop,summit};
}
function profileSVG(P){
  if(!P.walk) return "";
  const W=320,H=128,l=6,r=6,top=20,bot=22, total=P.walk+(P.tL!=null?.5:0);
  const emin=Math.min(P.e0,P.summit?P.ev.find(e=>e.kind==="end").e:P.e0), emax=P.eTop, span=Math.max(80,emax-emin);
  const X=t=>l+(P.clock(t)-P.start)/total*(W-l-r), Y=e=>top+(1-(e-emin)/span)*(H-top-bot);
  let dpath=""; const N=60; for(let k=0;k<=N;k++){const t=P.walk*k/N; dpath+=(k?"L":"M")+X(t).toFixed(1)+" "+Y(P.elev(t)).toFixed(1)}
  const dots=P.ev.filter(e=>e.kind==="snack").map(e=>`<circle cx="${X(e.t).toFixed(1)}" cy="${Y(e.e).toFixed(1)}" r="4.2" fill="var(--blaze)" stroke="var(--surface)" stroke-width="1.5"/>`).join("");
  const lunch=P.ev.find(e=>e.kind==="meal"&&e.t!=null);
  const lm=lunch?(()=>{const x=X(lunch.t),y=Y(lunch.e);return `<rect x="${(x-5).toFixed(1)}" y="${(y-5).toFixed(1)}" width="10" height="10" transform="rotate(45 ${x.toFixed(1)} ${y.toFixed(1)})" fill="var(--pine2)" stroke="var(--surface)" stroke-width="1.5"/>`})():"";
  const pk=P.summit?`<text x="${X(P.ev.find(e=>e.kind==="peak").t).toFixed(1)}" y="12" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${fmt(P.eTop)} mdpl</text>`:`<text x="${(W-r).toFixed(1)}" y="12" text-anchor="end" font-size="11" font-weight="700" fill="var(--ink)">${L("Camp","Camp")} ±${fmt(P.eTop)} mdpl</text>`;
  return `<svg class="prof" viewBox="0 0 ${W} ${H}" role="img" aria-label="${L("Profil ketinggian dan jadwal ngemil","Elevation profile and snack schedule")}">
    <path d="${dpath}L${X(P.walk).toFixed(1)} ${H-bot}L${X(0).toFixed(1)} ${H-bot}Z" fill="var(--greenbg)"/>
    <path d="${dpath}" fill="none" stroke="var(--pine2)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${lm}${pk}
    <text x="${l}" y="${H-6}" font-size="11" fill="var(--muted)">${hhmm(P.start)}</text>
    <text x="${W-r}" y="${H-6}" font-size="11" fill="var(--muted)" text-anchor="end">${hhmm(P.clock(P.walk))}</text>
  </svg>`;
}
function scheduleHTML(R,d){

function splitTasks(R){
  const P=S.people||1, out={}, load=Array(P).fill(0);
  const shared=Object.entries(R.shop).filter(([id])=>!isPersonal(id));
  // pembagian manual dulu
  shared.forEach(([id,q])=>{ const a=S.assign[id]; if(a!=null&&a!=="auto"&&(a==="each"||+a<P)){ out[id]=a; if(a!=="each") load[+a]+=food(id).g*q*P; } });
  // sisanya dibagi otomatis, barang terberat ke anggota yang bebannya paling ringan
  shared.filter(([id])=>out[id]==null).sort((a,b)=>food(b[0]).g*b[1]-food(a[0]).g*a[1]).forEach(([id,q])=>{
    let m=0; for(let k=1;k<P;k++) if(load[k]<load[m]) m=k; out[id]=m; load[m]+=food(id).g*q*P; });
  Object.keys(R.shop).filter(isPersonal).forEach(id=>{ out[id]= (S.assign[id]!=null&&S.assign[id]!=="auto"&&(S.assign[id]==="each"||+S.assign[id]<P))?S.assign[id]:"each"; });
  return out;
}

function todayIdx(n){ const t=new Date(todayStr()+"T00:00:00"), st=new Date(S.start+"T00:00:00"); const k=Math.round((t-st)/864e5); return (k>=0&&k<n)?k:null; }
function nowH(){ const d=new Date(); return d.getHours()+d.getMinutes()/60; }
function vTrail(){

  const next=eat.find(e=>!S.trail.done[e.id]&&(!isToday||e.time>=now-0.75))||eat.find(e=>!S.trail.done[e.id]);
  const eaten=eat.filter(e=>S.trail.done[e.id]).reduce((a,e)=>a+(e.k||0),0), planned=eat.reduce((a,e)=>a+(e.k||0),0);
  const wml=S.trail.water["d"+di]||0, wTarget=d.water*1000;

  return `<header class="top">${TOPO}<div class="wrap">
    <div class="hdr-row"><button class="hbtn" data-act="trailExit">${BACK} ${L("Rencana","Plan")}</button><div class="hdr-right"><button class="hbtn sos" data-act="sos">${L("Darurat","Emergency")}</button>${langToggle()}</div></div>
    <p class="hdr-step">${L("Mode Pendakian","Hiking mode")}</p><h1>${esc(planName())}</h1><p class="hdr-meta">${esc(dayDate(di))}${isToday?`, ${L("hari ini","today")}`:""}</p></div></header>
  <main class="wrap">${tabs}
    ${next?`<div class="nextc${late?" late":""}"><small>${late?L("Sudah lewat waktunya","It's past time"):L("Berikutnya","Up next")}, ${hhmm(next.time)}</small>
      <b>${esc(next.label)}</b>${next.what?`<p>${esc(next.what)}</p>`:""}
      <button class="btn light" data-act="eat" data-id="${next.id}">${L("Sudah dimakan","Done eating")}</button></div>`
     :`<div class="nextc"><b>${L("Semua makanan hari ini sudah dicentang","All of today's food is ticked off")}</b><p>${L("Mantap, tetap minum dan jaga kehangatan.","Nice work. Keep drinking and stay warm.")}</p></div>`}
    <div class="card"><div class="row-h"><h2>${L("Air minum","Drinking water")}</h2><span class="kcal-tag">${dec(wml/1000)} / ${dec(wTarget/1000)} L</span></div>
      <div class="meter"><i style="width:${Math.min(100,wml/wTarget*100)}%"></i></div>
      <div class="row3"><button class="btn sm ghost" data-act="water" data-v="-250">− 250 ml</button><button class="btn sm" data-act="water" data-v="250">+ 250 ml</button><button class="btn sm" data-act="water" data-v="500">+ 500 ml</button></div>
      <p class="note" style="margin:8px 0 0">${L("Minum sedikit tapi sering. Isi ulang di sumber air.","Drink little and often. Refill at water sources.")}</p></div>
    <div class="card"><div class="row-h"><h2>${L("Makan hari ini","Today's food")}</h2><span class="kcal-tag">${fmt(eaten)} / ${fmt(planned)} ${L("kkal","kcal")}</span></div>
      <div class="meter"><i style="width:${planned?Math.min(100,eaten/planned*100):0}%"></i></div>
      ${P.ev.map(e=>{const can=(e.kind==="snack"&&e.k)||(e.kind==="meal"&&e.on); const done=!!S.trail.done[e.id];
        return `<div class="tl ${e.kind}${done?" got":""}"><span class="tm">${hhmm(e.time)}</span>${can?`<button class="ck" data-act="eat" data-id="${e.id}" role="checkbox" aria-checked="${done}" aria-label="${esc(e.label)}"></button>`:`<span class="mk"></span>`}<span class="ac"><b>${esc(e.label)}</b>${e.what&&can?`<small class="what">${esc(e.what)}</small>`:""}</span><span class="el">${fmt(e.e)} m</span></div>`}).join("")}
    </div>
    <p class="note">${L("Pengingat muncul selama aplikasi terbuka. Data tersimpan di HP dan bisa dipakai tanpa sinyal.","Reminders show while the app is open. Everything is stored on your phone and works offline.")}</p>
    <div id="remind" class="remind" role="status" hidden></div>
  </main><div class="bar"><div class="wrap"><button class="btn sos-btn" data-act="sos">${L("Panduan darurat","Emergency guide")}</button></div></div>`;
}

function tips(R){
  const t=[], multi=R.n>1;
  if(R.snackPerHour) t.push(L(`Ngemil sekitar <b>${fmt(R.snackPerHour)} kkal tiap jam jalan</b>, misalnya 2 kurma dan setengah bungkus cokelat. Jangan tunggu sampai lapar atau lemas.`,`Snack about <b>${fmt(R.snackPerHour)} kcal per hour of walking</b>, such as 2 dates and half a pack of chocolate. Don't wait until you feel hungry or weak.`));
  t.push(L(`Minum sedikit tapi sering, kira-kira 0,5–0,75 liter per jam jalan. Tambahkan minuman ${term("elektrolit","elektrolit")} kalau banyak berkeringat.`,`Drink little and often, about 0.5–0.75 litres per hour of walking. Add an ${term("elektrolit","electrolyte")} drink if you sweat a lot.`));
  t.push(L("Tanyakan ke basecamp di mana sumber air terakhir, lalu isi penuh botol dari sana.","Ask the basecamp where the last water source is, and fill up there."));
  if(multi){
    t.push(L(`Tetap sarapan sebelum ${term("summit","summit attack")} walaupun belum lapar. Minuman hangat manis membantu tubuh cepat bertenaga.`,`Eat breakfast before the ${term("summit","summit push")} even if you're not hungry. A warm, sweet drink gives quick energy.`));
    t.push(L("Masak di luar tenda atau di teras tenda yang terbuka. Kompor di dalam tenda tertutup berisiko kebakaran dan keracunan gas.","Cook outside the tent or in an open vestibule. A stove inside a closed tent risks fire and gas poisoning."));
    t.push(L("Nasi bungkus dan lauk basah hanya untuk hari pertama. Hari berikutnya pakai makanan kering yang tidak mudah basi.","Packed rice meals and moist sides are for day one only. After that, use dry food that keeps."));
    t.push(L("Simpan makanan rapat di dalam tenda pada malam hari supaya tidak didatangi hewan.","Seal food inside the tent at night so animals don't get to it."));
  } else t.push(L("Untuk tektok, pilih makanan yang bisa dimakan tanpa dimasak supaya tidak perlu membawa kompor.","For a day hike, choose food you can eat without cooking so you can leave the stove at home."));
  t.push(L("Pindahkan makanan ke plastik ziplock dan buang kemasan berlebih di rumah. Carrier lebih ringan dan sampah lebih sedikit.","Repack food into zip bags and remove extra packaging at home. Your pack gets lighter and there's less trash."));
  t.push(L("Pisahkan camilan per hari dan taruh di kantong yang mudah dijangkau, misalnya hip belt atau saku depan.","Split snacks by day and keep them in easy-to-reach pockets, like the hip belt or a front pocket."));
  t.push(S.reserve!=="none"?L("Makanan cadangan sebaiknya disisihkan, bukan untuk camilan sehari-hari. Gunanya untuk berjaga kalau perjalanan lebih lama dari rencana.","Keep the spare food aside rather than snacking on it. It's there in case the trip takes longer than planned."):L("Kamu tidak membawa makanan cadangan. Pertimbangkan minimal sebungkus biskuit dan cokelat untuk keadaan darurat.","You're not packing emergency food. Consider at least a pack of biscuits and some chocolate."));
  if(S.exp==="first"){
    t.unshift(L("Untuk pendakian pertama, pilih jalur yang ramai, naik bersama orang yang sudah berpengalaman, dan rencanakan sudah selesai jalan sebelum gelap.","For your first hike, choose a busy trail, go with someone experienced, and plan to finish walking before dark."));
    t.push(L(`Kedinginan dan kurang makan bisa memicu ${term("hipotermia","hipotermia")}. Ganti baju basah, makan, dan minum minuman hangat saat sampai di camp.`,`Cold and too little food can lead to ${term("hipotermia","hypothermia")}. Change out of wet clothes, eat, and have a warm drink when you reach camp.`));
  }
  t.push(L("Kalau naik berkelompok, bagi tugas: satu orang membawa kompor dan gas, yang lain membawa beras atau lauk bersama. Camilan tetap dibawa masing-masing.","In a group, split the load: one person carries the stove and gas, others carry shared rice or sides. Everyone keeps their own snacks."));
  t.push(L("Bawa turun semua sampah, termasuk bungkus kecil dan sisa makanan.","Carry all trash back down, including small wrappers and leftovers."));
  return t;
}

function setItems(key,items){
  S.recipeOf=S.recipeOf||{};

}

function snapshot(){const s={...S};delete s.noteFor;delete s.confirm;delete s.view;delete s.step;delete s.edit;delete s.term;delete s.editPrice;delete s.tab;return s}
function storeHistory(){
  const R=calc(); if(!R) return;
  if(!S.pid) S.pid="p"+Date.now().toString(36);
  const old=HIST.find(x=>x.pid===S.pid);
  const h={note:old&&old.note,pid:S.pid,saved:Date.now(),name:planName(),when:dayDate(0,false),dur:durLabel(R.n),sum:`${fmt(R.K)} ${L("kkal","kcal")}, ${kg(R.G)}, ${rp(R.P)}`,data:snapshot()};
  HIST=HIST.filter(x=>x.pid!==S.pid); HIST.unshift(h); HIST=HIST.slice(0,30); saveHist();

let PREV=null;
function go(view,step){
  if(view==="glossary"&&S.view!=="glossary") PREV={view:S.view,step:S.step};
  S.view=view; if(step!=null) S.step=step; S.edit=null; S.term=null;
  if(view==="plan"&&S.step===5){ if(step!=null&&PREV===null&&S.view==="plan") {} storeHistory(); }
  save(); render(); window.scrollTo(0,0);
}
function back(){
  if(S.edit||S.term){S.edit=null;S.term=null;return renderSheet()}
  if(S.view==="glossary"&&PREV) {const p=PREV; PREV=null; return go(p.view,p.step);}
  if(S.view==="sos") return go("trail");
  if(S.view==="trail") return go("plan",5);
  if(S.view!=="plan") return go("welcome");
  if(S.step<=1) return go("welcome");
  go("plan",S.step-1);
}

}

  if(el.tagName==="SELECT"){
    if(["prov","mountain","route"].includes(k)&&Object.keys(S.custom).length&&el.value!==S[k]){
      S.confirm={title:L("Ganti tujuan pendakian?","Change destination?"),msg:L("Menu yang sudah kamu ubah akan dikembalikan ke menu saran.","Meals you've edited will go back to the suggested menu."),yes:L("Ganti","Change"),run:{a:"select",k,v:el.value}};
      el.value=S[k]; return renderSheet();
    }
    applySelect(k,el.value); return render();
  }
  if(el.type==="date"){ if(el.value&&!fullDate(el.value)) return; S[k]=el.value;
    if(k==="start"&&S.type==="multi"&&fullDate(S.start)){ const n=days(); if(!S.end||S.end<=S.start) S.end=addDays(S.start,1); }
    S.meals={}; save(); return render(); }
  S[k]=el.value; if(k==="startTime") S.meals={};
  save();
  if(S.view==="plan"&&S.step===1){ const nb=document.querySelector('.bar [data-act="next"]'); if(nb) nb.disabled=!routeData(); }
});
document.addEventListener("click",e=>{const inp=e.target.closest("input[type=date],input[type=time]");if(inp&&inp.showPicker){try{inp.showPicker()}catch(err){}}});

function shareText(){
  const R=calc(); if(!R) return "";
  const P=S.people||1, full=false;
  const it=l=>l.map(([id,q])=>`${fname(id)} ${qty(id,q)}`).join(", ");
  const Ls=[`*${L("Bekal","Food for")} ${planName()}*`,`${durLabel(R.n)}, ${L("mulai","from")} ${dayDate(0)}${P>1?`, ${P} ${L("orang","people")}`:""}`,""];
  if(full){
    Ls.push(`*${L("Menu per orang","Menu per person")}*`);
    R.D.forEach(d=>{Ls.push(`_${L("Hari","Day")} ${d.i+1}, ${dayDate(d.i)}_`); d.meals.filter(x=>x.on).forEach(x=>Ls.push(`• ${L(...SLOTS[x.slot].n)}: ${it(x.items)}`)); });
    if(R.reserve.items.length) Ls.push(`• ${L("Cadangan","Spare food")}: ${it(R.reserve.items)}`);
    Ls.push("");
  }
  const A=P>1?splitTasks(R):{};
  Ls.push(`*${L("Daftar belanja","Shopping list")}*`);
  Object.keys(CATS).forEach(c=>{const items=Object.entries(R.shop).filter(([id])=>food(id).c===c); if(!items.length) return;
    Ls.push(`_${L(...CATS[c])}_`); items.forEach(([id,q])=>Ls.push(`${S.got[id]?"☑":"☐"} ${fname(id)}, ${qty(id,q*P)}${P>1?` (${A[id]==="each"?L("masing-masing","each"):memberName(+A[id])})`:""}`)); });
  Ls.push("",`${L("Perkiraan biaya","Estimated cost")}: ${rp(R.P*P)}${P>1?` (${rp(R.P)} ${L("per orang","per person")})`:""}`,`${L("Air","Water")}: ±${dec(Math.max(...R.D.map(d=>d.water)))} L ${L("per orang per hari, isi ulang di sumber air","per person per day, refill at water sources")}`,"",L("Dibuat dengan Bekal Nanjak","Made with Bekal Nanjak"));
  return Ls.join("\n");
}
function copyList(viaShare,txt,toastSel){
  const text=txt||shareText(); if(!text) return;
  const box=$("#copybox"), toast=$(toastSel||"#toast");
  const fallbackCopy=()=>(navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject())
    .then(()=>{toast.textContent=L("Disalin. Tempel ke grup rombonganmu.","Copied. Paste it into your group chat."); box.hidden=true})
    .catch(()=>{box.value=text; box.hidden=false; box.select(); toast.textContent=L("Pilih teks di bawah lalu salin.","Select the text below and copy it.")});
  if(viaShare){
    if(navigator.share){ navigator.share({title:"Bekal Nanjak",text}).catch(err=>{ if(err&&err.name!=="AbortError") fallbackCopy(); }); return; }
    window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank","noopener"); return;
  }
  fallbackCopy();
}

let LAST_REMIND="";
setInterval(()=>{ if(S.view!=="trail") return; const R=calc(); if(!R) return; const ti=todayIdx(R.n); if(ti==null) return;
  const di=clamp(S.trailDay!=null?S.trailDay:ti,0,R.n-1); if(di!==ti) return;
  const P=dayPlan(R,R.D[di]), now=nowH();
  const due=P.ev.find(e=>((e.kind==="snack"&&e.k)||(e.kind==="meal"&&e.on))&&!(S.trail&&S.trail.done[e.id])&&e.time<=now&&e.time>now-0.25);
  const el=$("#remind"); if(!el) return;
  if(due&&LAST_REMIND!==due.id){ LAST_REMIND=due.id; el.hidden=false; el.textContent=L(`Waktunya ${due.label.toLowerCase()}`,`Time for: ${due.label}`)+(due.what?`: ${due.what}`:""); try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){} }
},30000);
render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
