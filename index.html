<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bekal Nanjak</title>
<meta name="description" content="Rencanakan bekal pendakian: kebutuhan kalori, menu per waktu makan, makanan cadangan, daftar belanja, dan kebutuhan air.">
<meta name="theme-color" content="#1F4D3A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --ink:#15201A; --muted:#56655C; --line:#E2E8E1;
  --pine:#1F4D3A; --pine2:#2F7356; --greenbg:#E3F3E9; --green:#257A4B;
  --blaze:#E2642A; --blaze-ink:#B4501E; --amber:#A86F07; --amberbg:#FCF1D8;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111814; --surface:#1B2520; --ink:#EAF0EB; --muted:#9FB0A5; --line:#2E3C34;
    --pine:#1B4533; --pine2:#2C6A50; --greenbg:#16301F; --green:#6FD39B;
    --blaze:#F07A42; --blaze-ink:#F07A42; --amber:#F0C35A; --amberbg:#352A12;
  }
}
:root[data-theme="dark"]{
  --bg:#111814; --surface:#1B2520; --ink:#EAF0EB; --muted:#9FB0A5; --line:#2E3C34;
  --pine:#1B4533; --pine2:#2C6A50; --greenbg:#16301F; --green:#6FD39B;
  --blaze:#F07A42; --blaze-ink:#F07A42; --amber:#F0C35A; --amberbg:#352A12;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:Barlow,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;line-height:1.05;margin:0}
button{font:inherit;color:inherit}
.wrap{width:100%;max-width:640px;margin:0 auto;padding-left:16px;padding-right:16px}
.topo{position:absolute;inset:0;width:100%;height:100%;opacity:.22;pointer-events:none}

/* header */
.top{position:relative;display:block;width:100%;background:var(--pine);color:#fff;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
.top .wrap{position:relative;padding-top:14px;padding-bottom:20px}
.hdr-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.backbtn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;min-height:40px;padding:0 12px;font-weight:600;cursor:pointer}
.hdr-step{opacity:.85;font-size:.92rem}
.hdr-sub{font-size:.95rem;opacity:.85;margin:12px 0 4px}
.top h1{font-size:2.2rem;letter-spacing:.01em;overflow-wrap:anywhere}
.hdr-meta{margin:6px 0 0;opacity:.9}
.progress{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:16px}
.progress i{display:block;height:5px;border-radius:99px;background:rgba(255,255,255,.25)}
.progress i.on{background:#fff}

/* onboarding */
.ob{position:relative;min-height:100vh;min-height:100dvh;background:var(--pine);color:#fff;overflow:hidden;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ob .wrap{position:relative;flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding-top:40px;padding-bottom:28px}
.ob h1{font-size:3.2rem}
.ob p.lead{font-size:1.1rem;opacity:.92;margin:10px 0 22px;max-width:34ch}
.ob ol{list-style:none;padding:0;margin:0 0 26px;display:grid;gap:12px}
.ob li{display:flex;gap:12px;align-items:flex-start}
.ob li b{flex:none;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-family:"Barlow Condensed",sans-serif;font-size:1.05rem}
.ob li span{padding-top:2px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;border:0;border-radius:14px;min-height:54px;padding:0 18px;font-family:"Barlow Condensed",sans-serif;font-size:1.45rem;font-weight:700;background:var(--pine);color:#fff;cursor:pointer}
.btn:active{background:var(--pine2)}
.btn.light{background:#fff;color:#1F4D3A}
.btn.ghost{background:transparent;color:inherit;border:1.5px solid currentColor}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ob .btn+.btn{margin-top:10px}

/* body */
main.wrap{padding-top:18px;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;min-width:0}
.card h2{font-size:1.45rem;margin-bottom:4px}
.card .hint{color:var(--muted);font-size:.92rem;margin:0 0 12px}
.opts{display:grid;gap:8px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:56px}
.opt b{display:block;font-size:1.05rem}
.opt small{display:block;color:var(--muted);font-size:.86rem}
.opt[aria-pressed=true]{border-color:var(--pine2);background:var(--greenbg)}
.opt .check{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line)}
.opt[aria-pressed=true] .check{border-color:var(--pine2);background:var(--pine2);box-shadow:inset 0 0 0 4px var(--greenbg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;min-height:42px;padding:0 15px;font-weight:600;cursor:pointer}
.chip[aria-pressed=true]{background:var(--pine);border-color:var(--pine);color:#fff}
.field{display:block;margin-bottom:14px;min-width:0}
.field:last-child{margin-bottom:0}
.field span{display:block;font-weight:600;margin-bottom:6px}
.field input{display:block;width:100%;min-width:0;min-height:48px;font:inherit;font-size:1.05rem;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px}
.field input:focus{outline:none;border-color:var(--pine2)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.row2 .field{margin-bottom:0}
.toggle2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--bg);border-radius:12px;padding:4px;margin-bottom:18px}
.toggle2 button{border:0;background:transparent;border-radius:10px;min-height:44px;font-weight:600;color:var(--muted);cursor:pointer}
.toggle2 button[aria-pressed=true]{background:var(--pine);color:#fff}
.slider{margin-bottom:18px}
.slider:last-child{margin-bottom:0}
.slider .sr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.slider output{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.4rem;line-height:1}
.slider output small{font-family:Barlow,sans-serif;font-weight:500;color:var(--muted);font-size:.85rem;margin-left:3px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;background:var(--line);outline:none;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--surface);border:3px solid var(--pine2);cursor:pointer}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--surface);border:3px solid var(--pine2);cursor:pointer}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:12px 0;cursor:pointer;min-height:58px}
.switch.first{border-top:0}
.switch b{display:block;font-weight:600}
.switch small{display:block;color:var(--muted);font-size:.86rem}
.sw-wrap{display:flex;align-items:center;gap:10px;flex:none}
.sw{flex:none;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.switch[aria-checked=true] .sw{background:var(--pine2)}
.switch[aria-checked=true] .sw::after{transform:translateX(18px)}
button:focus-visible,input:focus-visible{outline:2px solid var(--blaze);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.sw,.sw::after{transition:none}}

.day h3{font-size:1.4rem}
.dmeta{color:var(--muted);font-size:.9rem;margin:2px 0 4px}
.kcal-tag{font-family:"Barlow Condensed",sans-serif;font-weight:700;color:var(--muted);font-size:1.05rem;white-space:nowrap}

/* result */
.hero{position:relative;overflow:hidden;background:var(--pine);color:#fff;border-radius:14px;padding:16px 18px;margin-bottom:10px}
.hero .topo{opacity:.18}
.big{position:relative;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big b{font-family:"Barlow Condensed",sans-serif;font-size:3.4rem;font-weight:700;line-height:1}
.hero p{position:relative;margin:4px 0 0;opacity:.9;font-size:.95rem}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.stat small{display:block;color:var(--muted);font-size:.8rem}
.stat b{font-family:"Barlow Condensed",sans-serif;font-size:1.35rem;font-weight:700}
.stat.w b{color:var(--blaze-ink)}.stat.a b{color:var(--green)}
.meal{border-top:1px solid var(--line);padding:12px 0 2px}
.meal-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.meal-h b{font-size:1.05rem}
.meal.off .meal-h b{color:var(--muted);font-weight:500}
.items{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.items span{background:var(--bg);border-radius:8px;padding:4px 10px;font-size:.9rem}
.note{color:var(--muted);font-size:.9rem;margin:0 0 10px}
.alert{background:var(--amberbg);border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:.93rem}
.shop{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.shop div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line);font-weight:600}
.shop div:first-child{border-top:0}
.shop em{font-style:normal;color:var(--muted);font-weight:500;white-space:nowrap}
.tips{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.tips li{display:flex;gap:10px}
.tips li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--blaze);margin-top:8px}
.toast{text-align:center;color:var(--green);font-size:.92rem;min-height:1.3em;margin:8px 0 0}
textarea{width:100%;min-height:150px;margin-top:8px;font:inherit;font-size:.88rem;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
details.card{color:var(--muted);font-size:.9rem}
summary{cursor:pointer;font-weight:600;color:var(--ink);min-height:28px}
footer{color:var(--muted);font-size:.85rem;margin-top:8px}
footer a{color:var(--green)}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.bar .wrap{display:flex;gap:10px;padding-top:12px;padding-bottom:12px}
.bar .btn{flex:1;width:auto}
.bar .btn.ghost{flex:0 0 auto;padding:0 18px;color:var(--ink);border-color:var(--line);font-size:1.25rem}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="topo" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice">
    <g fill="none" stroke="#fff" stroke-width="1.4">
      <path d="M-20 230C60 180 110 200 170 150S290 60 420 90"/>
      <path d="M-20 250C70 205 120 222 180 175S300 90 420 115"/>
      <path d="M-20 205C50 160 100 175 160 128S280 35 420 62"/>
      <path d="M-20 180C45 140 95 150 150 105S270 10 420 35"/>
      <path d="M250 70c20-18 55-22 70-6s-8 40-35 44-52-20-35-38z"/>
      <path d="M262 72c14-10 36-12 45-2s-6 24-22 26-32-12-23-24z"/>
      <path d="M-20 270C80 230 130 245 190 200S310 120 420 140"/>
    </g>
  </symbol>
</svg>
<div id="app"></div>

<script>
/* ===================== DATA (perkiraan, cek ke basecamp) ===================== */
const MOUNTAINS = [
  {id:"merbabu",name:"Merbabu",prov:"Jawa Tengah",peak:3145,routes:[
    {id:"selo",name:"Selo",base:1800,up:6.5,down:4},
    {id:"suwanting",name:"Suwanting",base:1300,up:8,down:5},
    {id:"wekas",name:"Wekas",base:1700,up:6,down:4},
    {id:"thekelan",name:"Thekelan",base:1500,up:8,down:5}]},
  {id:"gede",name:"Gede",prov:"Jawa Barat",peak:2958,routes:[
    {id:"cibodas",name:"Cibodas",base:1300,up:7.5,down:5},
    {id:"putri",name:"Gunung Putri",base:1450,up:6.5,down:4.5},
    {id:"selabintana",name:"Selabintana",base:1100,up:9,down:6}]},
  {id:"pangrango",name:"Pangrango",prov:"Jawa Barat",peak:3019,routes:[
    {id:"cibodas",name:"Cibodas",base:1300,up:8.5,down:6}]},
  {id:"papandayan",name:"Papandayan",prov:"Jawa Barat",peak:2665,routes:[
    {id:"campdavid",name:"Camp David",base:2000,up:3,down:2.5}]},
  {id:"ciremai",name:"Ciremai",prov:"Jawa Barat",peak:3078,routes:[
    {id:"apuy",name:"Apuy",base:1250,up:7,down:5},
    {id:"palutungan",name:"Palutungan",base:1100,up:8,down:6},
    {id:"linggarjati",name:"Linggarjati",base:600,up:10,down:7}]},
  {id:"prau",name:"Prau",prov:"Jawa Tengah",peak:2565,routes:[
    {id:"patak",name:"Patak Banteng",base:2100,up:2.5,down:2},
    {id:"dwarawati",name:"Dwarawati",base:2100,up:3,down:2},
    {id:"wates",name:"Wates",base:1900,up:3,down:2.5}]},
  {id:"sindoro",name:"Sindoro",prov:"Jawa Tengah",peak:3153,routes:[
    {id:"kledung",name:"Kledung",base:1450,up:7.5,down:5},
    {id:"alangsewu",name:"Alang-alang Sewu",base:1650,up:6.5,down:4.5},
    {id:"tambi",name:"Tambi",base:1700,up:7,down:5}]},
  {id:"sumbing",name:"Sumbing",prov:"Jawa Tengah",peak:3371,routes:[
    {id:"garung",name:"Garung",base:1500,up:8,down:5.5},
    {id:"banaran",name:"Banaran",base:1600,up:7,down:5}]},
  {id:"slamet",name:"Slamet",prov:"Jawa Tengah",peak:3428,routes:[
    {id:"bambangan",name:"Bambangan",base:1500,up:9,down:6}]},
  {id:"lawu",name:"Lawu",prov:"Jawa Tengah dan Jawa Timur",peak:3265,routes:[
    {id:"cemorosewu",name:"Cemoro Sewu",base:1820,up:6.5,down:4},
    {id:"cemorokandang",name:"Cemoro Kandang",base:1830,up:7.5,down:5},
    {id:"cetho",name:"Candi Cetho",base:1470,up:9,down:6}]},
  {id:"semeru",name:"Semeru",prov:"Jawa Timur",peak:3676,routes:[
    {id:"ranupane",name:"Ranu Pane",base:2100,up:12,down:8,days:4}]},
  {id:"rinjani",name:"Rinjani",prov:"Nusa Tenggara Barat",peak:3726,routes:[
    {id:"sembalun",name:"Sembalun",base:1156,up:13,down:8,days:3},
    {id:"senaru",name:"Senaru, sampai bibir kawah",base:600,up:8,down:6,peak:2641}]},
  {id:"custom",name:"Gunung lain",prov:"Isi ketinggian sendiri",peak:null,routes:[
    {id:"manual",name:"Jalur saya",base:null,up:6,down:4}]}
];

const FOODS = {
  beras:{n:"Beras",u:"100 g",k:360,g:100}, mie:{n:"Mie instan",u:"bks",k:390,g:85},
  nasib:{n:"Nasi bungkus",u:"bks",k:600,g:350},
  oat:{n:"Oatmeal instan",u:"sachet",k:150,g:40}, roti:{n:"Roti tawar",u:"2 lbr",k:160,g:60},
  rotisi:{n:"Roti isi",u:"bks",k:230,g:70},
  abon:{n:"Abon",u:"30 g",k:150,g:30}, tempe:{n:"Kering tempe",u:"50 g",k:250,g:50},
  sosis:{n:"Sosis siap makan",u:"2 btg",k:120,g:50},
  sop:{n:"Sop instan",u:"sachet",k:50,g:15},
  kurma:{n:"Kurma",u:"5 btr",k:140,g:50}, coklat:{n:"Cokelat batang",u:"50 g",k:260,g:50},
  kacang:{n:"Kacang campur",u:"50 g",k:290,g:50}, wafer:{n:"Wafer",u:"bks 50 g",k:240,g:50},
  aren:{n:"Gula aren",u:"30 g",k:110,g:30}, biskuit:{n:"Biskuit padat",u:"bks 100 g",k:480,g:100},
  energen:{n:"Sereal instan",u:"sachet",k:130,g:30}, teh:{n:"Teh atau kopi manis",u:"sachet",k:100,g:25}
};

const SLOTS = {
  sarapan:{n:"Sarapan",t:"Pagi, sebelum jalan",share:.22},
  cemilan:{n:"Camilan jalur",t:"Sedikit tiap 45–60 menit",share:.23},
  siang:{n:"Makan siang",t:"Di jalur atau pos istirahat",share:.25},
  malam:{n:"Makan malam",t:"Di camp",share:.30}
};
const ORDER = ["sarapan","cemilan","siang","malam"];

/* ===================== STATE ===================== */
const KEY = "bekal-nanjak:v2";
function nextWeek(){const d=new Date();d.setDate(d.getDate()+7);const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}
function defaults(){return{
  step:0, mountain:null, route:null, peakManual:3000, baseManual:1500,
  date:nextWeek(), days:2, start:"08:00", up:6, down:4,
  sex:"m", age:25, height:168, weight:62, load:12,
  cold:true, light:false, veg:false, meals:{}, reserve:"meal", done:false, pickMountain:false
}}
let S = defaults();
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&typeof s==="object") S={...defaults(),...s,step:0};}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const $=s=>document.querySelector(s);
const fmt=n=>Math.round(n).toLocaleString("id-ID");
const dec=n=>(Math.round(n*2)/2).toLocaleString("id-ID");
const kg=g=>(g/1000).toLocaleString("id-ID",{maximumFractionDigits:1})+" kg";
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mountain=()=>MOUNTAINS.find(m=>m.id===S.mountain);
const route=()=>{const m=mountain();return m&&m.routes.find(r=>r.id===S.route)};
function peakBase(){
  const m=mountain(),r=route();
  if(!m||!r) return {peak:0,base:0};
  if(m.id==="custom") return {peak:+S.peakManual||0,base:+S.baseManual||0};
  return {peak:r.peak||m.peak,base:r.base};
}
const durLabel=d=>d===1?"Tektok, 1 hari":`${d} hari ${d-1} malam`;
function dayDate(i){
  const d=new Date(S.date+"T00:00:00"); if(isNaN(d)) return "";
  d.setDate(d.getDate()+i);
  return d.toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long"});
}
const BACK='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>';
const TOPO='<svg class="topo" aria-hidden="true"><use href="#topo"/></svg>';

/* ===================== PERHITUNGAN ===================== */
function slotsOfDay(i){
  return ORDER.filter(s=>!(s==="malam"&&i===S.days-1));
}
function defaultMealOn(i,slot){
  const last=S.days-1, startH=parseInt(S.start,10)||8;
  if(S.days===1) return slot==="cemilan"||(slot==="siang"&&startH<13);
  if(i===0){ if(slot==="sarapan") return false; if(slot==="siang") return startH<14; return true; }
  if(i===last){ if(slot==="siang") return false; return true; }
  return true;
}
function mealOn(i,slot){
  const k=`d${i}-${slot}`;
  return (k in S.meals)?S.meals[k]:defaultMealOn(i,slot);
}
function hoursPerDay(){
  const n=S.days, up=Math.max(0,+S.up||0), down=Math.max(0,+S.down||0);
  if(n===1) return [{up,down}];
  return Array.from({length:n},(_,i)=>i<n-1?{up:up*0.8/(n-1),down:0}:{up:up*0.2,down});
}
function template(slot,i){
  const veg=S.veg, light=S.light, lauk=veg?"tempe":(light?"abon":"sosis");
  switch(slot){
    case "sarapan": return [["oat",2,1],["roti",1,1],["energen",1,0]];
    case "siang": return (i===0&&!light)
      ? [["nasib",1,0],["rotisi",1,1]]
      : [["rotisi",2,1],[veg?"tempe":"abon",1,0]];
    case "malam": return light
      ? [["mie",1,1],[lauk,1,0],["sop",1,0],["teh",1,0]]
      : [["beras",1,1],["mie",1,0],[lauk,1,0],["sop",1,0],["teh",1,0]];
    case "cemilan": return light
      ? [["kacang",3,1],["coklat",3,1],["kurma",2,1],["aren",1,1]]
      : [["kurma",2,1],["coklat",2,1],["kacang",2,1],["wafer",2,1],["aren",1,1]];
    case "cadangan": return [["mie",1,0],["biskuit",1,1],["coklat",1,1],["aren",1,1]];
  }
  return [];
}
function menu(slot,i,target){
  const t=template(slot,i); let fixed=0,flexK=0;
  t.forEach(([id,q,f])=>{ if(f) flexK+=FOODS[id].k*q; else fixed+=FOODS[id].k*q; });
  const remain=Math.max(0,target-fixed);
  return t.map(([id,q,f])=>f?[id,Math.max(1,Math.round(remain*(FOODS[id].k*q/flexK)/FOODS[id].k))]:[id,q]);
}
function qty(id,q){const u=FOODS[id].u; return /^\d/.test(u)?(q>1?`${q} × ${u}`:u):`${q} ${u}`;}
const kOf=list=>list.reduce((a,[id,q])=>a+FOODS[id].k*q,0);
function calc(){
  const {peak,base}=peakBase();
  const gain=Math.max(100,peak-base);
  const bmr=10*S.weight+6.25*S.height-5*S.age+(S.sex==="m"?5:-161);
  const metUp=clamp(5.5+(gain/Math.max(.5,+S.up||0))/120,5.5,9.5);
  const days=hoursPerDay().map((h,i)=>{
    const trekH=h.up+h.down;
    const trek=(metUp*h.up+5*h.down)*(S.weight+S.load);
    const rest=bmr/24*Math.max(0,24-trekH)*(S.cold?1.3:1.2);
    const need=trek+rest;
    const water=Math.round((trekH*0.6+(S.days>1?1.5:0.5))*2)/2;
    const meals=slotsOfDay(i).map(slot=>{
      const on=mealOn(i,slot), target=need*SLOTS[slot].share;
      return {slot,on,target,items:on?menu(slot,i,target):[]};
    });
    return {i,trekH,need,water,meals};
  });
  const reserve=S.reserve==="none"?[]:menu("cadangan",0,S.reserve==="day"?bmr*1.6:750);
  const shop={};
  const add=list=>list.forEach(([id,q])=>{shop[id]=(shop[id]||0)+q});
  days.forEach(d=>d.meals.forEach(m=>add(m.items))); add(reserve);
  let carriedK=0,carriedG=0;
  for(const [id,q] of Object.entries(shop)){carriedK+=FOODS[id].k*q;carriedG+=FOODS[id].g*q;}
  const need=days.reduce((a,d)=>a+d.need,0);
  const trekH=days.reduce((a,d)=>a+d.trekH,0);
  const snackK=days.reduce((a,d)=>a+d.meals.filter(m=>m.slot==="cemilan"&&m.on).reduce((b,m)=>b+kOf(m.items),0),0);
  return {peak,base,days,reserve,shop,carriedK,carriedG,need,perDay:need/S.days,
    water:days.reduce((a,d)=>a+d.water,0), snackPerHour:trekH?Math.round(snackK/trekH/10)*10:0};
}

function tips(R){
  const t=[];
  if(R.snackPerHour) t.push(`Ngemil sekitar <b>${fmt(R.snackPerHour)} kkal tiap jam jalan</b>, misalnya 2 kurma dan setengah batang cokelat. Jangan tunggu sampai lapar atau lemas.`);
  t.push("Minum sedikit tapi sering, kira-kira 0,5–0,75 liter per jam jalan. Tambahkan oralit atau minuman elektrolit kalau banyak berkeringat.");
  t.push("Tanyakan ke basecamp di mana sumber air terakhir, lalu isi penuh botol dari sana.");
  if(S.days>1){
    t.push("Tetap sarapan sebelum summit attack walaupun belum lapar. Minuman hangat manis membantu tubuh cepat bertenaga.");
    t.push("Masak di luar tenda atau di teras tenda yang terbuka. Kompor di dalam tenda tertutup berisiko kebakaran dan keracunan gas.");
    t.push("Nasi bungkus dan lauk basah hanya untuk hari pertama. Hari berikutnya pakai makanan kering yang tidak mudah basi.");
    t.push("Simpan makanan rapat di dalam tenda pada malam hari supaya tidak didatangi hewan.");
  } else {
    t.push("Untuk tektok, pilih makanan yang bisa dimakan tanpa dimasak supaya tidak perlu membawa kompor.");
  }
  t.push("Pindahkan makanan ke plastik ziplock dan buang kemasan berlebih di rumah. Carrier lebih ringan dan sampah lebih sedikit.");
  t.push("Pisahkan camilan per hari dan taruh di kantong yang mudah dijangkau, misalnya hip belt atau saku depan.");
  t.push(S.reserve!=="none"
    ? "Jangan makan makanan cadangan sebagai camilan biasa. Itu jaminanmu kalau cuaca memburuk atau tertahan di jalur."
    : "Kamu tidak membawa makanan cadangan. Pertimbangkan minimal sebungkus biskuit dan cokelat untuk keadaan darurat.");
  t.push("Bawa turun semua sampah, termasuk bungkus kecil dan sisa makanan.");
  return t;
}

/* ===================== KONTROL ===================== */
const VIEWS=[viewWelcome,viewRoute,viewSchedule,viewBody,viewMeals,viewResult];
function render(){ $("#app").innerHTML=VIEWS[S.step](); paintRanges(); }
function paintRanges(){
  document.querySelectorAll("input[type=range]").forEach(el=>{
    const p=(el.value-el.min)/(el.max-el.min)*100;
    el.style.background=`linear-gradient(to right,var(--pine2) ${p}%,var(--line) ${p}%)`;
  });
}
function go(step){ if(step>=5&&!route()) step=1; S.step=step; if(step===5) S.done=true; save(); render(); window.scrollTo(0,0); }
function pickRoute(r){ S.route=r.id; S.up=r.up; S.down=r.down; if(r.days) S.days=r.days; S.meals={}; }

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b||b.disabled) return;
  const a=b.dataset.act;
  if(a==="goto") return go(+b.dataset.step);
  if(a==="next") return go(Math.min(5,S.step+1));
  if(a==="back") return go(Math.max(0,S.step-1));
  if(a==="new"){const keep={sex:S.sex,age:S.age,height:S.height,weight:S.weight,load:S.load,veg:S.veg,light:S.light,cold:S.cold}; S={...defaults(),...keep}; return go(1);}
  if(a==="mountain"){
    S.mountain=b.dataset.id; S.pickMountain=false; const m=mountain();
    if(m.routes.length===1) pickRoute(m.routes[0]); else S.route=null;
    save(); render(); window.scrollTo({top:0,behavior:"smooth"}); return;
  }
  if(a==="changeMountain"){ S.pickMountain=true; save(); return render(); }
  if(a==="route"){ pickRoute(mountain().routes.find(r=>r.id===b.dataset.id)); save(); return render(); }
  if(a==="days"){ S.days=+b.dataset.v; S.meals={}; save(); return render(); }
  if(a==="sex"){ S.sex=b.dataset.v; save(); return render(); }
  if(a==="toggle"){ S[b.dataset.k]=!S[b.dataset.k]; save(); return render(); }
  if(a==="meal"){ const k=b.dataset.key, [d,slot]=k.slice(1).split("-"); S.meals[k]=!mealOn(+d,slot); save(); return render(); }
  if(a==="reserve"){ S.reserve=b.dataset.v; save(); return render(); }
  if(a==="copy") return copyList();
});
document.addEventListener("input",e=>{
  const el=e.target, k=el.dataset&&el.dataset.k; if(!k) return;
  if(el.type==="range"){ S[k]=+el.value; el.closest(".slider").querySelector("output").firstChild.nodeValue=el.value; paintRanges(); }
  else if(el.type==="number"){ const v=parseFloat(el.value); if(isFinite(v)) S[k]=v; }
  else { S[k]=el.value; if(k==="start") S.meals={}; }
  save();
});

function copyList(){
  const R=calc(), m=mountain(), r=route();
  const L=[`Bekal ${m.id==="custom"?"pendakian":m.name+" via "+r.name}, ${durLabel(S.days)}, mulai ${dayDate(0)}`,""];
  R.days.forEach(d=>{
    L.push(`Hari ${d.i+1}, ${dayDate(d.i)}`);
    d.meals.filter(x=>x.on).forEach(x=>L.push(`- ${SLOTS[x.slot].n}: ${x.items.map(([id,q])=>`${FOODS[id].n} ${qty(id,q)}`).join(", ")}`));
    L.push("");
  });
  if(R.reserve.length) L.push("Cadangan: "+R.reserve.map(([id,q])=>`${FOODS[id].n} ${qty(id,q)}`).join(", "),"");
  L.push("Daftar belanja:");
  Object.entries(R.shop).forEach(([id,q])=>L.push(`- ${FOODS[id].n}: ${qty(id,q)}`));
  L.push("",`Total ±${fmt(R.carriedK)} kkal, ${kg(R.carriedG)}. Air ±${dec(R.water)} L.`);
  const text=L.join("\n"), box=$("#copybox"), toast=$("#toast");
  (navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject())
    .then(()=>{toast.textContent="Daftar belanja disalin. Tempel ke grup rombonganmu."; box.hidden=true;})
    .catch(()=>{box.value=text; box.hidden=false; box.select(); toast.textContent="Pilih teks di bawah lalu salin.";});
}

render();
if("serviceWorker" in navigator){ window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }); }
</script>
</body>
